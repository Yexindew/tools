<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演示标题 · 2026.xx</title>
<style>
  /* ─── 主题色变量（改这里换主题）─── */
  :root {
    --primary: #c0392b;          /* 主色 */
    --primary-dim: rgba(192,57,43,0.10);
    --primary-line: rgba(192,57,43,0.30);
    --bg: #f7f7f5;
    --bg2: #ffffff;
    --text: #1a1a1a;
    --text-muted: #777;
    --text-light: #bbb;
    --border: #e8e8e5;
    --shadow: 0 2px 20px rgba(0,0,0,0.07);
    --shadow-hover: 0 12px 48px rgba(0,0,0,0.14);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family: -apple-system,"PingFang SC","Helvetica Neue",sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* ─── 画布（全屏自适应）─── */
  #deck-wrapper {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #deck { width:100%; height:100%; position:relative; overflow:hidden; background:var(--bg); }

  /* ─── Slide ─── */
  .slide {
    position: absolute; left:0; width:100%; height:100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
    padding: 72px 0 48px;
    transition: transform 0.65s cubic-bezier(.77,0,.18,1);
    background: var(--bg2);
  }
  .slide-inner {
    width:100%; max-width:1200px;
    padding: 0 60px; height:100%;
    display: flex; flex-direction: column;
    justify-content: center;
  }

  /* ─── 顶部时间线导航 ─── */
  #timeline-nav {
    position: absolute; top:0; left:0; right:0; z-index:200;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 0 60px; height: 56px;
    display: flex; align-items: center; gap: 0;
  }
  .tl-node { display:flex; align-items:center; gap:0; cursor:pointer; flex-shrink:0; }
  .tl-dot {
    width:8px; height:8px; border-radius:50%;
    background:var(--text-light); border:2px solid var(--text-light);
    transition:all 0.4s; flex-shrink:0;
  }
  .tl-label { font-size:12px; color:var(--text-light); margin-left:6px; white-space:nowrap; transition:color 0.4s; }
  .tl-line-seg { flex:1; height:1px; background:var(--border); margin:0 8px; min-width:20px; transition:background 0.4s; }
  .tl-node.active .tl-dot { background:var(--primary); border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-dim); transform:scale(1.4); }
  .tl-node.active .tl-label { color:var(--primary); font-weight:600; }
  .tl-node.passed .tl-dot { background:var(--primary); border-color:var(--primary); opacity:0.5; }
  .tl-node.passed .tl-label { color:var(--text-muted); }
  .tl-line-seg.passed { background:var(--primary-line); }

  /* ─── 翻页箭头 ─── */
  .nav-arrow {
    position:absolute; z-index:150; bottom:32px;
    width:44px; height:44px; border-radius:50%;
    background:rgba(255,255,255,0.9); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; color:var(--text-muted);
    transition:all 0.2s; box-shadow:var(--shadow); user-select:none;
  }
  .nav-arrow:hover { border-color:var(--primary); color:var(--primary); }
  .nav-arrow.disabled { opacity:0.2; pointer-events:none; }
  #nav-prev { right:110px; }
  #nav-next { right:54px; }
  #slide-counter { position:absolute; bottom:42px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--text-light); letter-spacing:2px; z-index:150; }

  /* ─── 入场动画 ─── */
  .reveal { opacity:0; transform:translateY(20px); transition:opacity 0.6s cubic-bezier(.4,0,.2,1),transform 0.6s cubic-bezier(.4,0,.2,1); }
  .reveal.in { opacity:1; transform:translateY(0); }
  .d1{transition-delay:0.08s} .d2{transition-delay:0.16s} .d3{transition-delay:0.24s} .d4{transition-delay:0.32s} .d5{transition-delay:0.40s}

  /* ─── 通用文字组件 ─── */
  .ch-tag {
    display:inline-flex; align-items:center; gap:8px;
    font-size:11px; font-weight:700; letter-spacing:2px;
    color:var(--primary); text-transform:uppercase; margin-bottom:12px;
  }
  .ch-tag::before { content:''; display:block; width:18px; height:2px; background:var(--primary); }
  .ch-heading { font-size:42px; font-weight:800; letter-spacing:-1.5px; line-height:1.15; margin-bottom:12px; }
  .ch-desc { font-size:17px; color:var(--text-muted); line-height:1.7; margin-bottom:24px; max-width:900px; }

  /* ─── 封面组件 ─── */
  .cover-tag { font-size:14px; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:var(--primary); margin-bottom:24px; }
  .cover-hero { font-size:80px; font-weight:800; line-height:1.2; letter-spacing:-0.02em; margin-bottom:20px; }
  .cover-hl { background:linear-gradient(135deg,var(--primary),#e74c3c); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .cover-sub { font-size:24px; color:var(--text-muted); }
  .cover-stats { display:flex; gap:56px; margin-top:48px; padding-top:32px; border-top:1px solid var(--border); }
  .cstat-num { font-size:42px; font-weight:900; color:var(--primary); letter-spacing:-1px; line-height:1; }
  .cstat-label { font-size:12px; color:var(--text-muted); margin-top:4px; }

  /* ─── 卡片组件 ─── */
  .hcard {
    background:var(--bg2); border:1px solid var(--border);
    border-radius:14px; padding:22px 24px;
    transition:all 0.3s cubic-bezier(.4,0,.2,1); cursor:default;
  }
  .hcard:hover { transform:translateY(-3px); box-shadow:var(--shadow-hover); border-color:var(--primary-line); }
  .hcard.red { background:var(--primary-dim); border-color:var(--primary-line); }
  .hcard.red .hcard-title { color:var(--primary); }
  .hcard-title { font-size:15px; font-weight:700; margin-bottom:6px; line-height:1.3; }
  .hcard-body { font-size:13px; color:var(--text-muted); line-height:1.7; }
  /* hover 展开更多 */
  .hcard-more { max-height:0; overflow:hidden; opacity:0; transition:max-height 0.36s,opacity 0.3s; font-size:12px; color:var(--text-muted); line-height:1.7; margin-top:0; }
  .hcard:hover .hcard-more { max-height:200px; opacity:1; margin-top:8px; }

  /* ─── 数字卡 ─── */
  .stat-card { text-align:center; }
  .stat-card .stat-num { font-size:40px; font-weight:900; color:var(--primary); line-height:1; margin-bottom:6px; }
  .stat-card .stat-label { font-size:12px; color:var(--text-muted); }

  /* ─── 对话卡 ─── */
  .dialogue-wrap { background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:20px 22px; display:flex; flex-direction:column; gap:10px; }
  .dialogue-meta { font-size:11px; color:var(--text-light); letter-spacing:1px; margin-bottom:4px; }
  .dialogue-line { display:flex; align-items:flex-start; gap:10px; }
  .dialogue-avatar { width:26px; height:26px; border-radius:50%; background:var(--bg2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--text-muted); flex-shrink:0; }
  .dialogue-bubble { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:9px 13px; font-size:13px; color:var(--text); line-height:1.6; }

  /* ─── 原声气泡墙 ─── */
  .starfield-voices { display:grid; grid-template-columns:repeat(5,1fr); gap:10px 12px; width:100%; align-content:start; }
  .v-bubble { position:relative; background:#fff; border:1px solid var(--border); border-left:4px solid var(--bcolor,var(--primary)); border-radius:10px; padding:10px 14px; font-size:12px; line-height:1.5; color:var(--text); box-shadow:0 2px 12px rgba(0,0,0,0.04); transition:transform 0.3s,box-shadow 0.3s; }
  .v-bubble:hover { transform:translateY(-3px) scale(1.03)!important; box-shadow:0 8px 28px rgba(0,0,0,0.12); z-index:10; }
  .v-bubble b { display:block; font-size:11px; font-weight:700; color:var(--bcolor,var(--primary)); margin-bottom:3px; }
  .v-bubble.vb-lg { grid-column:span 2; font-size:13px; }

  /* ─── 下一步卡 ─── */
  .next-card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:20px 18px; transition:all 0.26s; }
  .next-card:hover { border-color:var(--primary-line); box-shadow:var(--shadow); transform:translateY(-2px); }
  .next-num { font-size:28px; font-weight:900; color:var(--primary); opacity:0.18; line-height:1; margin-bottom:6px; }
  .next-title { font-size:14px; font-weight:700; margin-bottom:5px; }
  .next-desc { font-size:12px; color:var(--text-muted); line-height:1.6; }

  /* ─── 横向条形图 ─── */
  .hbar { display:flex; flex-direction:column; gap:7px; }
  .hbar-row { display:flex; align-items:center; gap:8px; }
  .hbar-label { font-size:11px; color:var(--text-muted); width:160px; text-align:right; flex-shrink:0; line-height:1.2; }
  .hbar-track { flex:1; height:20px; background:rgba(0,0,0,0.04); border-radius:4px; overflow:hidden; }
  .hbar-fill { height:100%; border-radius:4px; transition:width 1s cubic-bezier(.4,0,.2,1); }
  .hbar-fill.muted { background:#e0cfc0; }
  .hbar-fill.hl { background:var(--primary); }
  .hbar-val { font-size:11px; font-weight:700; width:38px; flex-shrink:0; color:var(--text-muted); }
  .hbar-row.highlight .hbar-label,.hbar-row.highlight .hbar-val { color:var(--primary); font-weight:700; }

  /* ─── insight 卡（结尾用）─── */
  .insight-card { flex:1; background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:14px 16px; cursor:default; transition:all 0.3s; }
  .insight-card:hover { border-color:var(--primary-line); box-shadow:var(--shadow); transform:translateY(-2px); }
  .insight-title { font-size:13px; font-weight:700; color:var(--text); margin-bottom:6px; }
  .insight-detail { font-size:12px; color:var(--text-muted); line-height:1.7; }

  /* ─── 图片缩略图 + hover 弹出预览 ─── */
  .p3-thumb { position:relative; cursor:pointer; }
  .p3-thumb-imgs { display:flex; gap:3px; margin-top:4px; }
  .p3-thumb-imgs img { flex:1; height:40px; object-fit:cover; border-radius:3px; border:1px solid var(--border); }
  .p3-preview { display:none; } /* 内容由 JS overlay 渲染，此处仅存数据 */
  .p3-preview-title { font-size:13px; font-weight:700; color:var(--primary); flex-shrink:0; }
  .p3-preview-compare { display:flex; gap:16px; width:100%; flex:1; min-height:0; align-items:center; justify-content:center; }
  .p3-preview-side { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:center; }
  .p3-preview-side img { width:auto; max-width:100%; height:auto; max-height:85vh; object-fit:contain; border-radius:10px; border:1px solid var(--border); box-shadow:0 4px 20px rgba(0,0,0,0.08); }
  .p3-preview-label { font-size:10px; font-weight:700; letter-spacing:1px; padding:2px 8px; border-radius:4px; }
  .p3-preview-label.before { background:var(--bg); color:var(--text-muted); }
  .p3-preview-label.after { background:var(--primary-dim); color:var(--primary); }
</style>
</head>
<body>

<div id="deck-wrapper" style="background:var(--bg);">
<div id="deck">

<!-- ─── 顶部时间线（复制 .tl-node 按 slide 数量增减）─── -->
<nav id="timeline-nav">
  <div class="tl-node active" data-idx="0"><div class="tl-dot"></div><div class="tl-label">封面</div></div>
  <div class="tl-line-seg"></div>
  <div class="tl-node" data-idx="1"><div class="tl-dot"></div><div class="tl-label">章节1</div></div>
  <div class="tl-line-seg"></div>
  <div class="tl-node" data-idx="2"><div class="tl-dot"></div><div class="tl-label">Thanks</div></div>
</nav>

<button class="nav-arrow disabled" id="nav-prev">←</button>
<button class="nav-arrow" id="nav-next">→</button>
<div id="slide-counter">1 / 3</div>

<!-- ══════════════════════════════════════════ -->
<!-- P0 封面 -->
<!-- ══════════════════════════════════════════ -->
<div class="slide" id="s0">
  <div class="slide-inner" style="align-items:center;text-align:center">
    <div class="cover-tag reveal">项目复盘 · 2026.xx</div>
    <div class="cover-hero reveal d1">标题 <span class="cover-hl">关键词</span></div>
    <div class="cover-sub reveal d2">副标题一句话</div>
    <div class="cover-stats reveal d3">
      <div><div class="cstat-num">0,000</div><div class="cstat-label">指标A</div></div>
      <div><div class="cstat-num">000</div><div class="cstat-label">指标B</div></div>
      <div><div class="cstat-num">00</div><div class="cstat-label">指标C</div></div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════ -->
<!-- P1 内容页示例（左右布局）-->
<!-- ══════════════════════════════════════════ -->
<div class="slide" id="s1">
  <div class="slide-inner">
    <div class="ch-tag reveal">01 · 章节标题</div>
    <div class="ch-heading reveal d1">这页说什么</div>
    <div class="ch-desc reveal d2">一句话描述本页核心观点，不超过50字</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:12px" class="reveal d3">
      <!-- 左列：叙事/对话/图表 -->
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:20px 22px">
        <p style="font-size:13px;color:var(--text-muted)">左侧放叙事内容、对话、图表等</p>
      </div>
      <!-- 右列：hcard 三张 -->
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="hcard red" style="flex:1">
          <div class="hcard-title">核心洞察</div>
          <div class="hcard-body">最重要的结论放第一张红色卡片</div>
        </div>
        <div class="hcard" style="flex:1">
          <div class="hcard-title">支撑点 1</div>
          <div class="hcard-body">补充说明</div>
          <div class="hcard-more">hover 展开的隐藏内容</div>
        </div>
        <div class="hcard" style="flex:1">
          <div class="hcard-title">支撑点 2</div>
          <div class="hcard-body">补充说明</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════ -->
<!-- P2 结尾 -->
<!-- ══════════════════════════════════════════ -->
<div class="slide" id="s2">
  <div class="slide-inner" style="justify-content:center;align-items:center">
    <div class="reveal" style="font-size:56px;font-weight:700;text-align:center;margin-bottom:48px">Thanks</div>
    <div class="reveal d1" style="display:flex;gap:16px;max-width:900px">
      <div class="insight-card">
        <div class="insight-title">洞察 1</div>
        <div class="insight-detail">从这次项目里提炼的可复用认知，让听众带走一句话。</div>
      </div>
      <div class="insight-card">
        <div class="insight-title">洞察 2</div>
        <div class="insight-detail">另一个核心洞察。</div>
      </div>
      <div class="insight-card">
        <div class="insight-title">洞察 3</div>
        <div class="insight-detail">第三个核心洞察。</div>
      </div>
    </div>
  </div>
</div>

</div><!-- end #deck -->
</div><!-- end #deck-wrapper -->

<!-- hover 图片预览浮层（body 直接子元素，避免 slide transform 截断 fixed）-->
<div id="p3-overlay-backdrop" style="display:none;position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,0.4);pointer-events:none;"></div>
<div id="p3-overlay" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.9);width:88vw;height:96vh;background:#fff;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,0.35);padding:12px 32px 16px;z-index:9999;flex-direction:column;align-items:center;gap:6px;opacity:0;transition:opacity 0.25s,transform 0.25s;pointer-events:none;"></div>

<script>
(function(){
  /* ── 改这两个数字即可 ── */
  const TOTAL = 3;           // slide 总数
  const DECK_ID = 'deck';    // 不用改

  let cur = 0;
  const deck = document.getElementById(DECK_ID);
  const slides = [];
  for(let i=0;i<TOTAL;i++) slides.push(document.getElementById('s'+i));
  const counter = document.getElementById('slide-counter');
  const prev = document.getElementById('nav-prev');
  const next = document.getElementById('nav-next');
  const tlNodes = document.querySelectorAll('.tl-node');
  const tlLines = document.querySelectorAll('.tl-line-seg');

  function resize(){
    const W=window.innerWidth, H=window.innerHeight;
    deck.style.width=W+'px'; deck.style.height=H+'px';
    slides.forEach((s,i)=>{ s.style.width=W+'px'; s.style.height=H+'px'; s.style.top=(i*H)+'px'; });
    go(cur,true);
  }

  function go(idx, noAnim){
    if(idx<0||idx>=TOTAL) return;
    cur=idx;
    const H=deck.clientHeight||window.innerHeight;
    slides.forEach((s,i)=>{
      s.style.transition = noAnim ? 'none' : 'transform 0.65s cubic-bezier(.77,0,.18,1)';
      s.style.transform = 'translateY('+(-(cur*H))+'px)';
    });
    counter.textContent=(cur+1)+' / '+TOTAL;
    prev.classList.toggle('disabled',cur===0);
    next.classList.toggle('disabled',cur===TOTAL-1);
    tlNodes.forEach((n,i)=>{ n.classList.remove('active','passed'); if(i===cur) n.classList.add('active'); else if(i<cur) n.classList.add('passed'); });
    tlLines.forEach((l,i)=>{ l.classList.toggle('passed',i<cur); });
    setTimeout(()=>{ slides[cur].querySelectorAll('.reveal').forEach(el=>el.classList.add('in')); },80);
  }

  prev.addEventListener('click',()=>go(cur-1));
  next.addEventListener('click',()=>go(cur+1));
  tlNodes.forEach(n=>{ n.addEventListener('click',()=>{ const idx=parseInt(n.getAttribute('data-idx'),10); if(!isNaN(idx)) go(idx); }); });

  document.addEventListener('keydown',e=>{
    if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){ e.preventDefault(); go(cur+1); }
    else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); go(cur-1); }
    else if(e.key==='Home'){ e.preventDefault(); go(0); }
    else if(e.key==='End'){ e.preventDefault(); go(TOTAL-1); }
    else if(e.key==='Escape'){ closeOverlay(); }
  });

  let wheelLock=false;
  deck.addEventListener('wheel',e=>{
    e.preventDefault();
    if(wheelLock) return;
    wheelLock=true;
    if(e.deltaY>0) go(cur+1); else go(cur-1);
    setTimeout(()=>{wheelLock=false;},700);
  },{passive:false});

  let touchY=0;
  deck.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY;});
  deck.addEventListener('touchend',e=>{ const dy=e.changedTouches[0].clientY-touchY; if(Math.abs(dy)>40){ dy<0?go(cur+1):go(cur-1); } });

  /* ── 图片预览 hover ── */
  const overlay = document.getElementById('p3-overlay');
  const backdrop = document.getElementById('p3-overlay-backdrop');
  const allThumbs=Array.from(document.querySelectorAll('.p3-thumb'));
  let currentThumbIdx=-1, closeTimer=null;

  // 透明 hit area：overlay 开启时浮在缩略图上方（z-index:10001），鼠标可直接滑到下一张
  let hitAreas=[];
  function createHitAreas(){
    hitAreas.forEach(el=>el.remove()); hitAreas=[];
    allThumbs.forEach((thumb,i)=>{
      const r=thumb.getBoundingClientRect();
      const hit=document.createElement('div');
      hit.style.cssText='position:fixed;top:'+r.top+'px;left:'+r.left+'px;width:'+r.width+'px;height:'+r.height+'px;z-index:10001;cursor:pointer;';
      hit.addEventListener('mouseenter',()=>{ if(hoverTimer){clearTimeout(hoverTimer);hoverTimer=null;} switchTo(i); });
      hit.addEventListener('mouseleave',()=>{ hoverTimer=setTimeout(closeOverlay,120); });
      document.body.appendChild(hit); hitAreas.push(hit);
    });
  }
  function removeHitAreas(){ hitAreas.forEach(el=>el.remove()); hitAreas=[]; }

  function switchTo(idx){
    if(idx<0||idx>=allThumbs.length) return;
    const preview=allThumbs[idx].querySelector('.p3-preview');
    if(!preview) return;
    if(closeTimer){clearTimeout(closeTimer);closeTimer=null;}
    currentThumbIdx=idx;
    overlay.style.transition='opacity 0.13s';
    void overlay.offsetWidth;
    overlay.style.opacity='0';
    setTimeout(()=>{
      overlay.innerHTML=preview.innerHTML;
      overlay.style.transition='opacity 0.2s';
      void overlay.offsetWidth;
      overlay.style.opacity='1';
    },140);
  }

  function closeOverlay(){
    if(closeTimer){clearTimeout(closeTimer);closeTimer=null;}
    if(overlay){
      overlay.style.transition='opacity 0.2s,transform 0.2s';
      overlay.style.opacity='0';
      overlay.style.transform='translate(-50%,-50%) scale(0.95)';
      overlay.style.pointerEvents='none';
      closeTimer=setTimeout(()=>{ overlay.style.display='none'; closeTimer=null; removeHitAreas(); },200);
    }
    if(backdrop) backdrop.style.display='none';
  }

  let hoverTimer=null;
  function openOverlay(thumb){
    if(hoverTimer){clearTimeout(hoverTimer);hoverTimer=null;}
    const preview=thumb.querySelector('.p3-preview');
    if(!preview||!overlay) return;
    const idx=allThumbs.indexOf(thumb);
    if(overlay.style.display==='flex'){
      switchTo(idx);
    } else {
      currentThumbIdx=idx;
      overlay.innerHTML=preview.innerHTML;
      overlay.style.display='flex';
      overlay.style.transition='opacity 0.25s,transform 0.25s';
      if(backdrop) backdrop.style.display='block';
      requestAnimationFrame(()=>{
        overlay.style.opacity='1'; overlay.style.transform='translate(-50%,-50%) scale(1)'; overlay.style.pointerEvents='auto';
        createHitAreas();
      });
    }
  }

  document.querySelectorAll('.p3-thumb').forEach(thumb=>{
    thumb.addEventListener('mouseenter',function(){ openOverlay(this); });
    thumb.addEventListener('mouseleave',function(){ hoverTimer=setTimeout(closeOverlay,120); });
  });

  if(overlay){
    overlay.addEventListener('mouseenter',()=>{ if(hoverTimer){clearTimeout(hoverTimer);hoverTimer=null;} });
    overlay.addEventListener('mouseleave',closeOverlay);
    overlay.addEventListener('click',closeOverlay);
  }
  if(backdrop) backdrop.addEventListener('click',closeOverlay);

  window.addEventListener('resize',resize);
  resize();
  go(0,true);
  slides[0].querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
})();
</script>
</body>
</html>
